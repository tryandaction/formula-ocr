[project]
name = "formula-ocr-engine"
version = "0.1.0"
description = "Local companion service for Formula OCR"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pillow>=12.3,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
paddle = [
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
]
pix2text = [
  "pix2text>=1.1.4,<2",
]

[project.scripts]
formula-ocr-engine = "formula_ocr_engine.app:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formula_ocr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires downloaded model weights and RUN_MODEL_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["formula_ocr_engine"]
